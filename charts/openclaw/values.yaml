replicaCount: 1

image:
  repository: ghcr.io/openclaw/openclaw
  tag: "2026.2.9"
  pullPolicy: IfNotPresent

openclaw:
  bind: lan
  port: 18789
  config:
    gateway:
      mode: local
    agents:
      defaults:
        model:
          primary: "anthropic/claude-opus-4-6"
        timeoutSeconds: 600
        thinkingDefault: "high"
        sandbox:
          mode: "none"
          workspaceAccess: "rw"
    channels:
      slack:
        enabled: true
        botToken: "${SLACK_BOT_TOKEN}"
        appToken: "${SLACK_APP_TOKEN}"
        dm:
          enabled: true
          policy: pairing
        channels:
          "#michael-tasks":
            allow: true
          "#michael-approvals":
            allow: true
            requireMention: true
          "#michael-reports":
            allow: true
    tools:
      allow:
        - read
        - write
        - edit
        - exec
        - browser
        - web_fetch
        - web_search
        - slack
        - sessions_list
      deny:
        - process
      elevated:
        enabled: false
    logging:
      redactSensitive: tools

service:
  type: ClusterIP
  port: 18789

ingress:
  enabled: true
  host: openclaw.spark-b0f2.local
  path: /
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  enabled: true
  size: 5Gi
  storageClass: local-path
  mountPath: /home/node/.openclaw

secrets:
  anthropicApiKey: ""
  slackBotToken: ""
  slackAppToken: ""
  slackSigningSecret: ""
  gmailAddress: ""
  gmailAppPassword: ""
  openaiApiKey: ""
  elevenlabsApiKey: ""
  anthropicSetupToken: ""
  gatewayToken: ""  # Auto-generated if empty
