apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  OPENCLAW_LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  OPENCLAW_LLM_MODEL: {{ .Values.config.llmModel | quote }}
  SLACK_CHANNEL_TASKS: {{ .Values.config.slackChannels.tasks | quote }}
  SLACK_CHANNEL_APPROVALS: {{ .Values.config.slackChannels.approvals | quote }}
  SLACK_CHANNEL_REPORTS: {{ .Values.config.slackChannels.reports | quote }}
  GMAIL_READ_ONLY: {{ .Values.config.gmail.readOnly | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-soul
data:
  soul.md: |
    {{- .Files.Get "soul.md" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-openclaw-config
data:
  openclaw.json: |
    {
      "gateway": {
        "bind": "loopback",
        "port": 18789
      },
      "agents": {
        "defaults": {
          "sandbox": {
            "mode": "all",
            "workspaceAccess": "rw"
          }
        }
      },
      "channels": {
        "slack": {
          "enabled": true,
          "botToken": "${SLACK_BOT_TOKEN}",
          "appToken": "${SLACK_APP_TOKEN}",
          "dm": {
            "enabled": true,
            "policy": "pairing"
          },
          "channels": {
            "{{ .Values.config.slackChannels.tasks }}": { "allow": true },
            "{{ .Values.config.slackChannels.approvals }}": { "allow": true },
            "{{ .Values.config.slackChannels.reports }}": { "allow": true }
          },
          "requireMention": true
        }
      },
      "tools": {
        "allow": [
          "read", "write", "edit", "exec",
          "browser", "web_fetch", "web_search",
          "slack", "sessions_list"
        ],
        "deny": ["process"],
        "elevated": {
          "enabled": false
        }
      },
      "logging": {
        "redactSensitive": "tools"
      }
    }
