apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  SLACK_BOT_TOKEN: {{ .Values.secrets.slackBotToken | quote }}
  SLACK_APP_TOKEN: {{ .Values.secrets.slackAppToken | quote }}
  SLACK_SIGNING_SECRET: {{ .Values.secrets.slackSigningSecret | quote }}
  GMAIL_ADDRESS: {{ .Values.secrets.gmailAddress | quote }}
  GMAIL_APP_PASSWORD: {{ .Values.secrets.gmailAppPassword | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenlabsApiKey | quote }}
  {{- if .Values.secrets.gatewayToken }}
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.secrets.gatewayToken | quote }}
  {{- else }}
  OPENCLAW_GATEWAY_TOKEN: {{ randAlphaNum 32 | quote }}
  {{- end }}
