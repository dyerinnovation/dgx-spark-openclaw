apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    app: openclaw
    component: gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: openclaw
      component: gateway
  template:
    metadata:
      labels:
        app: openclaw
        component: gateway
      annotations:
        checksum/config: {{ .Values.openclaw.config | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["node", "-e"]
          args:
            - |
              const fs = require('fs');
              const dir = '/home/node/.openclaw';
              if (!fs.existsSync(dir)) fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
              const configPath = dir + '/openclaw.json';
              const helmConfig = JSON.parse(fs.readFileSync('/config/openclaw.json', 'utf8'));
              let existing = {};
              try { existing = JSON.parse(fs.readFileSync(configPath, 'utf8')); } catch {}
              const merged = { ...existing, ...helmConfig };
              fs.writeFileSync(configPath, JSON.stringify(merged, null, 2), { mode: 0o600 });
              console.log('Config merged:', Object.keys(merged).join(', '));
              // Copy soul document
              try {
                fs.copyFileSync('/soul/soul.md', dir + '/soul.md');
                console.log('Soul document copied');
              } catch {}
              // Generate auth-profiles.json from ANTHROPIC_SETUP_TOKEN
              const token = process.env.ANTHROPIC_SETUP_TOKEN;
              const agentDir = dir + '/agents/main/agent';
              fs.mkdirSync(agentDir, { recursive: true, mode: 0o700 });
              if (token) {
                const authStore = {
                  version: 1,
                  profiles: {
                    'anthropic:manual': {
                      type: 'token',
                      provider: 'anthropic',
                      token: token,
                      label: 'manual'
                    }
                  }
                };
                const authJson = JSON.stringify(authStore, null, 2);
                const authPaths = [dir + '/auth-profiles.json', agentDir + '/auth-profiles.json'];
                authPaths.forEach(p => fs.writeFileSync(p, authJson, { mode: 0o600 }));
                console.log('Auth profiles generated with correct format (version 1, type: token)');
              } else {
                console.log('WARN: ANTHROPIC_SETUP_TOKEN not set, skipping auth-profiles.json generation');
                // Still try to copy existing auth-profiles if present
                try {
                  fs.copyFileSync(dir + '/auth-profiles.json', agentDir + '/auth-profiles.json');
                  console.log('Existing auth profiles copied to agent dir');
                } catch {}
              }
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: openclaw-config
              mountPath: /config
            - name: soul
              mountPath: /soul
      containers:
        - name: openclaw
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "openclaw.mjs", "gateway", "--bind", "{{ .Values.openclaw.bind }}", "--port", "{{ .Values.openclaw.port }}"]
          ports:
            - containerPort: {{ .Values.openclaw.port }}
              name: gateway
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=4096"
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/.openclaw
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: gateway
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: gateway
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-home
        - name: openclaw-config
          configMap:
            name: {{ .Release.Name }}-openclaw-config
        - name: soul
          configMap:
            name: {{ .Release.Name }}-soul
        - name: tmp
          emptyDir: {}
